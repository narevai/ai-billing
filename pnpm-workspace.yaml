packages:
  - 'packages/*'
  - 'examples/*'
  - 'examples/utils/*'
  - 'apps/*'

childConcurrency: 1
networkConcurrency: 4
workspaceConcurrency: 1

allowBuilds:
  sharp: false

catalogs:
  default:
    # Build & Tooling
    '@types/node': '22.19.15'
    '@types/react': '19.2.18'
    '@types/react-dom': '19.2.5'
    '@vitest/coverage-v8': '5.1.0'
    tsup: '9.0.0'
    typescript: '5.9.3'
    oxfmt: '0.65.0'
    oxlint: '1.57.0'
    vitest: '5.1.0'
    knip: '6.0.5'
    '@changesets/cli': '3.0.3'
    '@edge-runtime/vm': '5.0.0'
    zod: '4.6.7'
    eslint-plugin-jsdoc: '65.4.3'
    eslint-plugin-tsdoc: '0.5.2'
    typedoc: '0.28.19'
    typedoc-plugin-markdown: '4.11.0'
    turbo: '2.9.14'

    # AI SDK Stack
    ai: '6.0.185'
    '@ai-sdk/openai': '3.0.106'
    '@ai-sdk/provider': '4.0.10'
    '@ai-sdk/rsc': '2.0.322'
    '@openrouter/ai-sdk-provider': '2.3.3'
    jsondiffpatch: '0.7.7'
    undici: '7.30.1'

    # HTTP
    ky: '2.0.2'

    # Next.js & React
    next: '16.4.1'
    react: '19.2.4'
    react-dom: '19.2.4'
    postcss: '8.5.32'

    # Storybook
    '@storybook/addon-docs': '10.4.0'
    '@storybook/addon-themes': '10.4.0'
    '@storybook/react': '10.4.0'
    '@storybook/react-vite': '10.4.0'
    storybook: '10.6.2'
    vite: '8.1.6'
    source-map-js: '1.2.2'
    baseline-browser-mapping: '2.11.35'

    # OpenTelemetry (examples)
    '@opentelemetry/api': '1.9.1'
    '@opentelemetry/api-logs': '0.220.0'
    '@opentelemetry/core': '2.9.0'
    '@opentelemetry/instrumentation': '0.216.0'
    '@opentelemetry/resources': '2.9.0'
    '@opentelemetry/sdk-logs': '0.220.0'
    '@opentelemetry/sdk-metrics': '2.9.0'
    '@opentelemetry/sdk-trace-base': '2.9.0'

    # Markdown / rich text (examples)
    markdown-it: '14.3.3'
    linkify-it: '5.0.2'
    dompurify: '3.4.17'
    mermaid: '11.17.2'
    prosemirror-markdown: '1.13.9'
    prosemirror-model: '1.25.12'
    prosemirror-view: '1.42.3'
    prosemirror-example-setup: '1.2.3'
    prosemirror-inputrules: '1.4.0'
    prosemirror-schema-basic: '1.2.5'
    prosemirror-schema-list: '1.6.0'
    prosemirror-state: '1.4.3'
