packages:
  - 'packages/*'
  - 'examples/*'
  - 'examples/utils/*'
  - 'apps/*'
allowBuilds:
  sharp: false

overrides:
  '@opentelemetry/core': '>=2.8.0'
  '@opentelemetry/resources': '>=2.8.0'
  dompurify: '>=3.4.13'
  linkify-it: '^6.0.0'
  markdown-it: '>=14.2.0'
  mermaid: '>=11.16.1'
  nanoid: '^6.0.0'
  postcss: '>=8.5.23'
  postcss>nanoid: '^6.0.0'
  sharp: '>=0.35.0'
  undici: '>=6.24.0'
  uuid: '>=14.0.0'

catalogs:
  default:
    # Build & Tooling
    '@types/node': '^22.15.3'
    '@types/react': '19.2.18'
    '@types/react-dom': '19.2.5'
    '@vitest/coverage-v8': '4.1.11'
    tsup: '^8.5.1'
    typescript: '5.9.3'
    oxfmt: '^0.65.0'
    oxlint: '^1.57.0'
    vitest: '4.1.11'
    knip: '^6.0.4'
    '@changesets/cli': '^2.30.0'
    '@edge-runtime/vm': '^5.0.0'
    zod: '^4.3.6'
    'eslint-plugin-jsdoc': '^63.0.0'
    'eslint-plugin-tsdoc': '^0.5.0'

    typedoc: '^0.28.19'
    typedoc-plugin-markdown: '^4.11.0'

    # Tooling Orchestration
    turbo: '^2.8.20'

    # AI SDK Stack
    ai: '^6.0.138'
    '@ai-sdk/openai': '^3.0.0'
    '@ai-sdk/provider': '^3.0.8'
    '@openrouter/ai-sdk-provider': '^2.3.3'

    # HTTP
    ky: '^2.0.2'

    # Next.js & React
    next: '16.2.11'
    react: '^19.2.0'
    'react-dom': '^19.2.0'
